<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>点亮中国 · 城市打卡</title>
  <style>
    :root {
      --bg1: #0f172a;
      --bg2: #1e293b;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f8fafc;
      --muted: #94a3b8;
      --lit: #f59e0b;
      --lit-bright: #fbbf24;
      --unlit: #334155;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(56, 189, 248, 0.18), transparent 60%),
        radial-gradient(1000px 500px at 90% 10%, rgba(245, 158, 11, 0.14), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      padding: 24px;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    h1 .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--lit);
      box-shadow: 0 0 14px var(--lit-bright);
    }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }

    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.2s ease;
      backdrop-filter: blur(6px);
    }
    button:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); }
    button.primary { background: var(--lit); color: #1e1b10; border-color: transparent; font-weight: 600; }
    button.primary:hover { background: var(--lit-bright); }
    button.danger:hover { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .stats {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .stat-group {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px 16px;
      backdrop-filter: blur(6px);
    }
    .stat-group-title {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .stat-group-title b { color: var(--text); font-weight: 600; }
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }
    .stat {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .stat .num {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .stat .num em { font-style: normal; font-size: 15px; color: var(--muted); font-weight: 500; }
    .stat .label { color: var(--muted); font-size: 13px; margin-top: 5px; }
    .stat .sub { color: var(--muted); font-size: 12px; margin-top: 4px; opacity: 0.8; }
    .stat.highlight .num { color: var(--lit-bright); }

    .progress-track {
      height: 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      transition: width 0.4s ease;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.6);
    }

    .map-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 14px 8px;
      backdrop-filter: blur(6px);
    }
    .map-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 6px 2px;
    }
    .map-toolbar .location { color: var(--muted); font-size: 13px; }
    .map-toolbar .location b { color: var(--lit-bright); font-weight: 600; }
    #btnBack { display: none; padding: 6px 14px; font-size: 13px; }

    #map { width: 100%; height: 620px; }

    .legend {
      display: flex;
      gap: 22px;
      justify-content: center;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
      padding: 4px 0 8px;
      flex-wrap: wrap;
    }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      display: inline-block;
    }
    .swatch.lit { background: var(--lit); box-shadow: 0 0 8px var(--lit-bright); }
    .swatch.partial { background: #b45309; }
    .swatch.unlit { background: var(--unlit); border: 1px solid #475569; }

    .list-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px 18px;
      backdrop-filter: blur(6px);
    }
    .list-card h2 {
      font-size: 15px;
      color: var(--muted);
      font-weight: 600;
    }
    .list-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .tabs { display: flex; gap: 6px; }
    .tab {
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      transition: all 0.2s ease;
    }
    .tab:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.3); }
    .tab.active { background: var(--lit); color: #1e1b10; border-color: transparent; font-weight: 600; }
    .group { margin-bottom: 14px; }
    .group:last-child { margin-bottom: 0; }
    .group-name {
      font-size: 14px;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 7px;
    }
    .group-name .cnt { color: var(--lit-bright); font-weight: 700; }
    .group-name .total { color: var(--muted); font-weight: 500; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.16);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fcd34d;
      font-size: 13px;
    }
    .chip.unlit-chip {
      background: rgba(148, 163, 184, 0.12);
      border-color: rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
    }
    .empty { color: var(--muted); font-size: 14px; }

    .tip {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-top: -6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1><span class="dot"></span>点亮中国 · 城市打卡</h1>
        <div class="subtitle">先点省份进入，再点城市打卡；去过的城市会点亮，再点一次可取消</div>
      </div>
      <div class="actions">
        <button class="primary" id="btnLightAll">一键全亮</button>
        <button id="btnRandom">随机打卡</button>
        <button class="danger" id="btnReset">清空重置</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat-group">
        <div class="stat-group-title">按城市统计</div>
        <div class="stat-cards">
          <div class="stat highlight">
            <div class="num"><span id="litCount">0</span><em> / <span id="totalCount">0</span></em></div>
            <div class="label">已点亮城市</div>
          </div>
          <div class="stat">
            <div class="num"><span id="percent">0</span><em>%</em></div>
            <div class="label">城市点亮率</div>
          </div>
          <div class="stat">
            <div class="num"><span id="remainCount">0</span><em> 个</em></div>
            <div class="label">还没去过的城市</div>
          </div>
        </div>
      </div>

      <div class="stat-group">
        <div class="stat-group-title">按省份统计</div>
        <div class="stat-cards">
          <div class="stat highlight">
            <div class="num"><span id="provLitCount">0</span><em> / <span id="provTotalCount">34</span></em></div>
            <div class="label">已点亮省份</div>
            <div class="sub">去过至少 1 个城市</div>
          </div>
          <div class="stat">
            <div class="num"><span id="provPercent">0</span><em>%</em></div>
            <div class="label">省份点亮率</div>
            <div class="sub">其中完全点亮 <span id="provFullCount">0</span> 省</div>
          </div>
          <div class="stat">
            <div class="num"><span id="provRemainCount">34</span><em> 个</em></div>
            <div class="label">还没去过的省份</div>
            <div class="sub">一个城市都没点亮</div>
          </div>
        </div>
      </div>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="map-card">
      <div class="map-toolbar">
        <button id="btnBack">← 返回全国</button>
        <span class="location">当前位置：<b id="location">全国</b></span>
      </div>
      <div id="map"></div>
      <div class="legend">
        <span><i class="swatch lit"></i>全部点亮</span>
        <span><i class="swatch partial"></i>点亮了一部分</span>
        <span><i class="swatch unlit"></i>还没去</span>
        <span>👆 点省份下钻 / 点城市打卡</span>
      </div>
    </div>

    <div class="list-card">
      <div class="list-head">
        <h2>城市清单</h2>
        <div class="tabs">
          <button class="tab active" id="tabVisited">我去过的</button>
          <button class="tab" id="tabRemain">还没去的</button>
        </div>
      </div>
      <div id="groups"><div class="empty">还没有点亮任何城市，点击地图开始吧～</div></div>
    </div>

    <div class="tip">数据只保存在你的浏览器本地（localStorage），不会上传到任何服务器。</div>
  </div>

  <script src="assets/echarts.min.js"></script>
  <script>
    const STORAGE_KEY = 'visited_cities_v1';
    const TAWAN = '710000';

    const LIT_COLOR = '#f59e0b';
    const PARTIAL_COLOR = '#b45309';
    const UNLIT_COLOR = '#334155';

    let chart = null;
    let provinces = [];          // [{adcode, name}]
    let provinceCities = {};     // { adcode: [{adcode, name}] }
    let geoCache = {};           // { adcode: geojson }
    let allCities = [];          // [{adcode, name, province}]
    let currentProvince = null;  // null=全国视图, 否则 {adcode, name}
    let visited = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));

    async function loadChina() {
      const res = await fetch('assets/china.json');
      const j = await res.json();
      echarts.registerMap('china', j);
      provinces = j.features
        .filter(f => f.properties && f.properties.name)
        .map(f => ({ adcode: String(f.properties.adcode), name: f.properties.name }));
    }

    async function loadProvince(province) {
      if (province.adcode === TAWAN) {
        // 台湾无细分数据，整省作为一个可打卡单元
        provinceCities[province.adcode] = [{ adcode: TAWAN, name: province.name }];
        return;
      }
      try {
        const res = await fetch('assets/cities/' + province.adcode + '.json');
        const j = await res.json();
        geoCache[province.adcode] = j;
        provinceCities[province.adcode] = j.features.map(f => ({
          adcode: String(f.properties.adcode),
          name: f.properties.name,
        }));
      } catch (e) {
        provinceCities[province.adcode] = [{ adcode: province.adcode, name: province.name }];
      }
    }

    async function init() {
      await loadChina();
      await Promise.all(provinces.map(p => loadProvince(p)));
      allCities = [];
      provinces.forEach(p => {
        (provinceCities[p.adcode] || []).forEach(c => {
          allCities.push({ adcode: c.adcode, name: c.name, province: p.name });
        });
      });
      renderChart();
      renderCountry();
      refreshStats();
    }

    function litCountOf(province) {
      let n = 0;
      (provinceCities[province.adcode] || []).forEach(c => { if (visited.has(c.adcode)) n++; });
      return n;
    }

    function buildCountryData() {
      return provinces.map(p => {
        const cities = provinceCities[p.adcode] || [];
        const lit = litCountOf(p);
        let color = UNLIT_COLOR, glow = false;
        if (lit > 0) {
          color = (lit === cities.length) ? LIT_COLOR : PARTIAL_COLOR;
          glow = (lit === cities.length);
        }
        return {
          name: p.name,
          value: lit,
          itemStyle: {
            areaColor: color,
            borderColor: lit > 0 ? '#fff' : '#475569',
            borderWidth: lit > 0 ? 1.2 : 0.8,
            shadowBlur: glow ? 16 : 0,
            shadowColor: glow ? 'rgba(251,191,36,0.7)' : 'transparent',
          },
        };
      });
    }

    function buildProvinceData() {
      return (provinceCities[currentProvince.adcode] || []).map(c => {
        const lit = visited.has(c.adcode);
        return {
          name: c.name,
          value: lit ? 1 : 0,
          itemStyle: {
            areaColor: lit ? LIT_COLOR : UNLIT_COLOR,
            borderColor: lit ? '#fff' : '#475569',
            borderWidth: lit ? 1.2 : 0.8,
            shadowBlur: lit ? 14 : 0,
            shadowColor: lit ? 'rgba(251,191,36,0.7)' : 'transparent',
          },
        };
      });
    }

    function tooltipFormatter(p) {
      if (!currentProvince) {
        const prov = provinces.find(x => x.name === p.name);
        const cities = provinceCities[prov.adcode] || [];
        const lit = litCountOf(prov);
        const status = lit === 0 ? '⬜ 还没去过' : (lit === cities.length ? '✅ 全部点亮' : `🔥 点亮 ${lit}/${cities.length}`);
        return `<b>${p.name}</b><br/>${status}<br/><span style="color:#94a3b8;font-size:12px">点击进入查看城市</span>`;
      } else {
        const city = provinceCities[currentProvince.adcode].find(c => c.name === p.name);
        const lit = city && visited.has(city.adcode);
        return `<b>${p.name}</b><br/>${lit ? '✅ 已点亮' : '⬜ 还没去过'}`;
      }
    }

    function renderChart() {
      chart = echarts.init(document.getElementById('map'));
      chart.on('click', onMapClick);
      window.addEventListener('resize', () => chart && chart.resize());
    }

    function onMapClick(params) {
      if (!params.name) return;
      if (currentProvince) {
        const city = provinceCities[currentProvince.adcode].find(c => c.name === params.name);
        if (city) toggleCity(city.adcode);
      } else {
        const province = provinces.find(p => p.name === params.name);
        if (!province) return;
        if (province.adcode === TAWAN || !geoCache[province.adcode]) {
          // 无下级地图数据：直接打卡整省
          toggleCity(province.adcode);
        } else {
          drillDown(province);
        }
      }
    }

    function toggleCity(adcode) {
      if (visited.has(adcode)) visited.delete(adcode);
      else visited.add(adcode);
      persist();
      refreshStats();
      updateMapColors();
    }

    function drillDown(province) {
      echarts.registerMap('province', geoCache[province.adcode]);
      currentProvince = province;
      document.getElementById('location').textContent = province.name;
      document.getElementById('btnBack').style.display = 'inline-block';
      chart.setOption(buildMapOption('province', buildProvinceData(), true), true);
    }

    function renderCountry() {
      currentProvince = null;
      document.getElementById('location').textContent = '全国';
      document.getElementById('btnBack').style.display = 'none';
      chart.setOption(buildMapOption('china', buildCountryData(), false), true);
    }

    function updateMapColors() {
      if (currentProvince) {
        chart.setOption({ series: [{ data: buildProvinceData() }] });
      } else {
        chart.setOption({ series: [{ data: buildCountryData() }] });
      }
    }

    function buildMapOption(mapName, data, isProvince) {
      return {
        backgroundColor: 'transparent',
        tooltip: {
          trigger: 'item',
          backgroundColor: 'rgba(15,23,42,0.92)',
          borderColor: 'rgba(255,255,255,0.15)',
          textStyle: { color: '#f8fafc', fontSize: 13 },
          formatter: tooltipFormatter,
        },
        series: [{
          name: mapName,
          type: 'map',
          map: mapName,
          roam: true,
          scaleLimit: { min: 0.7, max: 8 },
          selectedMode: false,
          label: {
            show: true,
            color: '#e2e8f0',
            fontSize: isProvince ? 8 : 9,
          },
          itemStyle: {
            areaColor: UNLIT_COLOR,
            borderColor: '#475569',
            borderWidth: 0.8,
          },
          emphasis: {
            label: { color: '#fff', fontWeight: 'bold' },
            itemStyle: { areaColor: LIT_COLOR, shadowBlur: 20, shadowColor: 'rgba(251,191,36,0.8)' },
          },
          data: data,
        }],
      };
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...visited]));
    }

    function refreshStats() {
      const lit = visited.size;
      const total = allCities.length;
      const remain = total - lit;
      const percent = total === 0 ? 0 : Math.round((lit / total) * 100);

      document.getElementById('litCount').textContent = lit;
      document.getElementById('totalCount').textContent = total;
      document.getElementById('percent').textContent = percent;
      document.getElementById('remainCount').textContent = remain;
      document.getElementById('progressFill').style.width = percent + '%';

      // —— 省份维度统计 ——
      const provTotal = provinces.length;
      const visitedProvinces = provinces.filter(p => litCountOf(p) > 0).length;
      const fullyLitProvinces = provinces.filter(p => {
        const cities = provinceCities[p.adcode] || [];
        return cities.length > 0 && litCountOf(p) === cities.length;
      }).length;
      const provRemain = provTotal - visitedProvinces;
      const provPercent = provTotal === 0 ? 0 : Math.round((visitedProvinces / provTotal) * 100);

      document.getElementById('provLitCount').textContent = visitedProvinces;
      document.getElementById('provTotalCount').textContent = provTotal;
      document.getElementById('provPercent').textContent = provPercent;
      document.getElementById('provFullCount').textContent = fullyLitProvinces;
      document.getElementById('provRemainCount').textContent = provRemain;

      renderList();
    }

    // —— 城市清单：我去过的 / 还没去的 ——
    let listMode = 'visited';

    function renderList() {
      const groupsEl = document.getElementById('groups');
      const isVisited = listMode === 'visited';
      const list = allCities.filter(c => isVisited ? visited.has(c.adcode) : !visited.has(c.adcode));

      if (list.length === 0) {
        groupsEl.innerHTML = isVisited
          ? '<div class="empty">还没有点亮任何城市，点击地图开始吧～</div>'
          : '<div class="empty">太棒了，全国城市都点亮啦 🎉</div>';
        return;
      }

      const byProvince = {};
      list.forEach(c => {
        if (!byProvince[c.province]) byProvince[c.province] = [];
        byProvince[c.province].push(c.name);
      });

      groupsEl.innerHTML = provinces
        .filter(p => byProvince[p.name])
        .map(p => {
          const names = byProvince[p.name];
          const total = (provinceCities[p.adcode] || []).length;
          const chipCls = isVisited ? 'chip' : 'chip unlit-chip';
          const suffix = isVisited
            ? `<span class="cnt">${names.length}</span><span class="total">/${total}</span>`
            : `<span class="cnt">${names.length}</span><span class="total"> 个还没去</span>`;
          return `<div class="group">
            <div class="group-name">${p.name} ${suffix}</div>
            <div class="chips">${names.map(n => `<span class="${chipCls}">${n}</span>`).join('')}</div>
          </div>`;
        })
        .join('');
    }

    function setListMode(mode) {
      listMode = mode;
      document.getElementById('tabVisited').classList.toggle('active', mode === 'visited');
      document.getElementById('tabRemain').classList.toggle('active', mode === 'remain');
      renderList();
    }

    document.getElementById('tabVisited').addEventListener('click', () => setListMode('visited'));
    document.getElementById('tabRemain').addEventListener('click', () => setListMode('remain'));

    // 按钮事件
    document.getElementById('btnBack').addEventListener('click', renderCountry);
    document.getElementById('btnLightAll').addEventListener('click', () => {
      allCities.forEach(c => visited.add(c.adcode));
      persist(); refreshStats(); updateMapColors();
    });
    document.getElementById('btnReset').addEventListener('click', () => {
      visited.clear();
      persist(); refreshStats(); updateMapColors();
    });
    document.getElementById('btnRandom').addEventListener('click', () => {
      const n = Math.floor(Math.random() * 12) + 3;
      const shuffled = [...allCities].sort(() => Math.random() - 0.5);
      shuffled.slice(0, n).forEach(c => visited.add(c.adcode));
      persist(); refreshStats(); updateMapColors();
    });

    init();
  </script>
</body>
</html>
